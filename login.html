<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Painel Administrativo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body-login">
    <div class="login-card">
        <h1>Painel Restrito</h1>
        <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Faça login para gerenciar os projetos do portfólio.</p>
        
        <form id="form-login">
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" required placeholder="seu-email@escola.com">
            </div>
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required placeholder="Sua senha">
            </div>
            <button type="submit" class="btn">Entrar</button>
            <p id="mensagem-erro" style="margin-top: 15px; font-size: 0.9rem; display: none;"></p>
        </form>

        <p style="margin-top: 1.5rem; text-align: center;">
            <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Voltar para a Página Inicial</a>
        </p>
    </div>

    <!-- Script de Autenticação -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
